<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>天鼎国际 - 财务与合同审计底稿系统 2.0</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          brand: { green: '#1F3A2E', greenlight: '#2D5141', gold: '#B08D57', goldlight: '#D9C29A', cream: '#F7F4EC', ink: '#23201B' }
        },
        fontFamily: { sans: ['Inter', 'Noto Sans SC', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] }
      }
    }
  }
</script>
<style>
  body { background-color: #F7F4EC; color: #23201B; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: #F7F4EC; }
  ::-webkit-scrollbar-thumb { background: #D9C29A; border-radius: 3px; }
  .glass-header { background: rgba(31, 58, 46, 0.95); backdrop-filter: blur(10px); }
  .tr-hover:hover { background-color: rgba(176, 141, 87, 0.05); }
</style>
</head>
<body class="min-h-screen flex flex-col font-sans">

  <!-- 顶部导航 -->
  <header class="glass-header text-white sticky top-0 z-40 shadow-lg border-b border-brand-greenlight">
    <div class="max-w-[1600px] mx-auto px-4 sm:px-6 py-3 flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center gap-4">
        <div class="w-10 h-10 rounded bg-brand-gold flex items-center justify-center text-brand-green font-bold text-xl shadow-inner font-serif">鼎</div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="font-bold text-base sm:text-lg tracking-wide text-brand-cream">天鼎国际 · 财务与合同管理后台</h1>
            <span class="text-[10px] px-2 py-0.5 rounded border border-brand-goldlight/50 text-brand-goldlight font-medium">SME-FRS 2.0 引擎</span>
          </div>
          <p class="text-xs text-brand-goldlight/70 mt-0.5">HK TIANDING INTERNATIONAL TRADE LIMITED | 云端同步</p>
        </div>
      </div>
      <div class="flex flex-wrap items-center gap-3">
        <button onclick="pushToCloud()" id="btnSync" class="px-4 py-2 rounded bg-brand-gold hover:bg-brand-goldlight text-brand-green text-xs font-bold transition shadow-sm flex items-center gap-1">
          <span>☁️</span> <span id="syncBtnText">同步账套至 Google Sheets</span>
        </button>
      </div>
    </div>
  </header>

  <!-- 状态门禁横幅 -->
  <div class="max-w-[1600px] w-full mx-auto px-4 sm:px-6 pt-5">
    <div id="gatekeeperBanner" class="rounded-lg p-4 border-2 shadow-sm flex flex-wrap items-center justify-between gap-4">
      <!-- JS 动态渲染 -->
    </div>
  </div>

  <!-- 主工作区 -->
  <main class="max-w-[1600px] w-full mx-auto px-4 sm:px-6 py-6 flex-1 grid grid-cols-1 xl:grid-cols-12 gap-6">

    <!-- 左侧：录入表单 (4列) -->
    <div class="xl:col-span-4 space-y-6">
      <div class="bg-white rounded-lg border border-brand-goldlight/30 shadow-sm overflow-hidden">
        <div class="px-4 py-3 bg-brand-cream border-b border-brand-goldlight/30 flex justify-between items-center">
          <h2 class="font-bold text-sm text-brand-green">银行流水录入 (多币种)</h2>
        </div>
        <form id="txForm" onsubmit="handleAddTx(event)" class="p-4 space-y-3 text-xs">
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-brand-ink/70 font-medium mb-1">交易日期</label>
              <input type="date" id="txDate" required class="w-full px-2 py-1.5 border border-brand-goldlight/50 rounded bg-brand-cream/50" value="2026-03-04">
            </div>
            <div>
              <label class="block text-brand-ink/70 font-medium mb-1">收支方向</label>
              <select id="txDir" class="w-full px-2 py-1.5 border border-brand-goldlight/50 rounded bg-brand-cream/50 font-semibold">
                <option value="dep">存入 (Deposit)</option>
                <option value="wd">支出 (Withdrawal)</option>
              </select>
            </div>
          </div>
          
          <div class="grid grid-cols-3 gap-3 bg-brand-cream/40 p-3 rounded border border-brand-goldlight/20">
            <div class="col-span-1">
              <label class="block text-brand-ink/70 font-medium mb-1">币种</label>
              <select id="txCcy" class="w-full px-2 py-1.5 border border-brand-goldlight/50 rounded font-bold font-mono">
                <option value="HKD">HKD</option>
                <option value="USD">USD</option>
                <option value="CNY">CNY</option>
                <option value="EUR">EUR</option>
              </select>
            </div>
            <div class="col-span-2">
              <label class="block text-brand-ink/70 font-medium mb-1">原币金额</label>
              <input type="number" id="txAmt" step="0.01" required class="w-full px-2 py-1.5 border border-brand-goldlight/50 rounded font-mono font-bold" value="3500.00">
            </div>
          </div>
          <!-- 汇率提示 -->
          <div class="text-[10px] text-brand-ink/50 flex justify-between px-1">
            <span>折算汇率: 1 EUR ≈ 8.48 HKD</span>
            <span>折合港币: HK$ 29,680.00</span>
          </div>

          <div>
            <label class="block text-brand-ink/70 font-medium mb-1">交易对手 / 客户名称</label>
            <input type="text" id="txName" required class="w-full px-2 py-1.5 border border-brand-goldlight/50 rounded" value="BERLIN DIGITAL GMBH">
          </div>
          
          <div>
            <label class="block text-brand-ink/70 font-medium mb-1">交易摘要</label>
            <input type="text" id="txDesc" required class="w-full px-2 py-1.5 border border-brand-goldlight/50 rounded" value="收到德国客户汇入款项">
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-brand-ink/70 font-medium mb-1">会计科目代码</label>
              <select id="txCat" class="w-full px-2 py-1.5 border border-brand-goldlight/50 rounded bg-orange-50 text-orange-800 font-semibold">
                <option value="UNCLASSIFIED">⚠️ 待分类 (UNCLASSIFIED)</option>
                <option value="REV_SERVICE">主营业务收入-服务</option>
                <option value="REV_TRADE">主营业务收入-贸易</option>
                <option value="COGS_PURCHASE">主营业务成本-采购</option>
                <option value="LIAB_SH_LOAN_IN">股东借款</option>
              </select>
            </div>
            <div>
              <label class="block text-brand-ink/70 font-medium mb-1">凭证编号 (Ref)</label>
              <input type="text" id="txRef" class="w-full px-2 py-1.5 border border-brand-goldlight/50 rounded" placeholder="如: INV-2026-08">
            </div>
          </div>

          <button type="submit" class="w-full py-2 bg-brand-green hover:bg-brand-greenlight text-brand-cream font-bold rounded transition mt-2">
            保存并计入四表
          </button>
        </form>
      </div>
    </div>

    <!-- 右侧：流水列表与报表 (8列) -->
    <div class="xl:col-span-8 space-y-6">
      
      <!-- 流水表格 -->
      <div class="bg-white rounded-lg border border-brand-goldlight/30 shadow-sm overflow-hidden">
        <div class="flex border-b border-brand-goldlight/30 bg-brand-cream px-4 pt-3 text-xs">
          <button class="px-4 py-2 font-bold rounded-t bg-white text-brand-green border-t-2 border-brand-gold font-medium">流水总账 & 凭证勾兑</button>
        </div>
        <div class="p-4 overflow-x-auto">
          <table class="w-full text-xs text-left min-w-[800px]">
            <thead class="bg-brand-cream/50 text-brand-green border-y border-brand-goldlight/30">
              <tr>
                <th class="py-2.5 px-3 font-bold">日期</th>
                <th class="py-2.5 px-3 font-bold">参考号</th>
                <th class="py-2.5 px-3 font-bold">摘要 / 对手</th>
                <th class="py-2.5 px-3 font-bold text-right">原币金额</th>
                <th class="py-2.5 px-3 font-bold">科目代码</th>
                <th class="py-2.5 px-3 font-bold">凭证号</th>
                <th class="py-2.5 px-3 font-bold text-center">状态</th>
              </tr>
            </thead>
            <tbody id="ledgerBody" class="divide-y divide-brand-goldlight/20">
              <!-- JS 渲染 -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <div id="toast" class="fixed bottom-5 right-5 px-4 py-2 bg-brand-green text-brand-cream text-xs font-bold rounded shadow-lg hidden z-50"></div>

  <script>
    const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbz8gHk8a7sQ39pOcF3jsfXsp5rYEJisyQsW6iAivsK2DbfLTHykf9EyfZuCzi6UoLP4/exec';
    const ROOT_FOLDER_ID = '1WGyKD8j2V2QRxqB-PffUpwqAqZkHUFxo';

    let db = {
      entity: {
        id: 'comp_tianding_01',
        name_cn: '香港天鼎國際貿易有限公司',
        name_en: 'HK TIANDING INTERNATIONAL TRADE LIMITED',
        br_no: '78630568',
        transactions: [
          { date: '2025-11-10', ref: 'HSBC-2883-001', ccy: 'HKD', desc: '股东无息借款划入', dep: 445000.00, wd: 0, cat: 'LIAB_SH_LOAN_IN', doc_ref: 'SH-LOAN-TD01', status: '已核验' },
          { date: '2026-03-04', ref: 'HSBC-EUR-260304', ccy: 'EUR', desc: '收到德国客户汇入款项', dep: 3500.00, wd: 0, cat: 'UNCLASSIFIED', doc_ref: '', status: '待核验' }
        ],
        petty_cash: [], fixed_assets: [], hsbc_weekly_rates: []
      }
    };

    function render() {
      const tbody = document.getElementById('ledgerBody');
      tbody.innerHTML = '';
      
      let warningsCount = 0;

      db.entity.transactions.forEach((t) => {
        const isMissing = !t.doc_ref || t.cat === 'UNCLASSIFIED';
        if (isMissing) warningsCount++;

        const tr = document.createElement('tr');
        tr.className = isMissing ? 'bg-amber-50' : 'tr-hover';
        tr.innerHTML = `
          <td class="py-2 px-3 font-mono">${t.date}</td>
          <td class="py-2 px-3 font-mono text-brand-ink/60">${t.ref}</td>
          <td class="py-2 px-3 font-medium">${t.desc}</td>
          <td class="py-2 px-3 text-right font-mono font-bold ${t.dep > 0 ? 'text-emerald-600' : 'text-rose-600'}">
            ${t.ccy} ${t.dep > 0 ? '+' : '-'}${t.dep || t.wd}
          </td>
          <td class="py-2 px-3 font-mono text-brand-green">${t.cat}</td>
          <td class="py-2 px-3 font-mono">${t.doc_ref || '<span class="text-amber-600 font-bold">缺失</span>'}</td>
          <td class="py-2 px-3 text-center">
            <span class="px-2 py-0.5 rounded text-[10px] font-bold ${isMissing ? 'bg-amber-200 text-amber-800' : 'bg-emerald-100 text-emerald-800'}">${t.status}</span>
          </td>
        `;
        tbody.appendChild(tr);
      });

      // 更新门禁横幅
      const banner = document.getElementById('gatekeeperBanner');
      if (warningsCount > 0) {
        banner.className = 'rounded-lg p-4 border-2 border-amber-400 bg-amber-50 shadow-sm flex flex-wrap items-center justify-between gap-4';
        banner.innerHTML = `
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-amber-500 text-white flex items-center justify-center font-bold text-lg shrink-0">!</div>
            <div>
              <div class="flex items-center gap-2">
                <span class="px-2 py-0.5 text-xs font-bold rounded bg-amber-600 text-white">草稿暂记配平模式</span>
                <h3 class="font-bold text-sm text-amber-950">尚有 ${warningsCount} 笔流水缺失凭证或待分类</h3>
              </div>
              <p class="text-xs text-amber-900/70 mt-1">补齐清单后，即可解锁最终审计定稿表。</p>
            </div>
          </div>
        `;
      } else {
        banner.className = 'rounded-lg p-4 border-2 border-emerald-500 bg-emerald-50 shadow-sm flex flex-wrap items-center justify-between gap-4';
        banner.innerHTML = `
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-emerald-500 text-white flex items-center justify-center font-bold text-lg shrink-0">✓</div>
            <div>
              <h3 class="font-bold text-sm text-emerald-950">100% 凭证勾稽完成</h3>
              <p class="text-xs text-emerald-900/70 mt-1">所有流水均已分类并附有凭证，可解锁最终审计定稿表。</p>
            </div>
          </div>
        `;
      }
    }

    function handleAddTx(e) {
      e.preventDefault();
      const dir = document.getElementById('txDir').value;
      const ref = 'TX-' + Date.now().toString().slice(-6);
      
      const newTx = {
        date: document.getElementById('txDate').value,
        ref: ref,
        ccy: document.getElementById('txCcy').value,
        desc: document.getElementById('txDesc').value,
        dep: dir === 'dep' ? parseFloat(document.getElementById('txAmt').value) : 0,
        wd: dir === 'wd' ? parseFloat(document.getElementById('txAmt').value) : 0,
        cat: document.getElementById('txCat').value,
        doc_ref: document.getElementById('txRef').value,
        status: (!document.getElementById('txRef').value || document.getElementById('txCat').value === 'UNCLASSIFIED') ? '待核验' : '已核验'
      };

      db.entity.transactions.unshift(newTx);
      render();
      showToast('流水已添加至暂存池！');
      document.getElementById('txForm').reset();
    }

    async function pushToCloud() {
      const btn = document.getElementById('btnSync');
      const btnText = document.getElementById('syncBtnText');
      btn.disabled = true;
      btnText.textContent = '同步中...';
      btn.classList.add('opacity-70');

      const payload = {
        action: 'saveEntity',
        root_folder_id: ROOT_FOLDER_ID,
        entity: db.entity
      };

      try {
        const res = await fetch(GAS_API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });
        
        const result = await res.json();
        if (result.status === 'ok') {
          showToast('✅ 成功同步至 Google Sheets！');
          window.open(result.sheet_url, '_blank'); // 自动打开云端表格
        } else {
          showToast('❌ 同步失败: ' + result.message, true);
        }
      } catch (err) {
        showToast('❌ 网络错误，请检查 GAS 权限', true);
      } finally {
        btn.disabled = false;
        btnText.textContent = '同步账套至 Google Sheets';
        btn.classList.remove('opacity-70');
      }
    }

    function showToast(msg, isError = false) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.className = `fixed bottom-5 right-5 px-4 py-2 text-xs font-bold rounded shadow-lg z-50 ${isError ? 'bg-rose-600 text-white' : 'bg-brand-green text-brand-cream'}`;
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('hidden'), 3000);
    }

    window.onload = render;
  </script>
</body>
</html>
