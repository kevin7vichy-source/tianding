<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HK TIANDING INTERNATIONAL TRADE LIMITED｜香港天鼎國際貿易有限公司</title>
<meta name="description" content="HK TIANDING INTERNATIONAL TRADE LIMITED: Technical consulting services, marketing & brand strategy, overseas healthcare market operations, purple rice & blueberry anthocyanin R&D and global sales, and e-commerce operations.">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#1F3A2E">
<style>
/* ================= 核心变量与字体 ================= */
:root{
  --g:#1F3A2E; /* 主绿 */
  --g-dark:#162a21;
  --g2:#2D5141;
  --au:#B08D57; /* 香槟金 */
  --au-light:#D9C29A;
  --iv:#F7F4EC; /* 米白背景 */
  --ink:#23201B;
  --mu:#6E685D;
  --ln:#DDD5C4;
  --font-serif:"Georgia","Times New Roman","Noto Serif CJK TC","Songti TC",serif;
  --font-sans:"Inter",-apple-system,BlinkMacSystemFont,"PingFang HK","Noto Sans CJK TC",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:80px}
body{font-family:var(--font-sans);color:var(--ink);background:var(--iv);line-height:1.75;font-size:15.5px;-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3,.serif{font-family:var(--font-serif);font-weight:700;letter-spacing:.02em}
a{color:inherit;text-decoration:none;transition:all 0.3s ease}
img{display:block;max-width:100%;transition:transform 0.6s cubic-bezier(0.25, 1, 0.5, 1)}
.w{max-width:1120px;margin:0 auto;padding:0 24px}

/* ================= 滚动入场动画 ================= */
.reveal{opacity:0;transform:translateY(40px);transition:all 0.8s cubic-bezier(0.25, 1, 0.5, 1)}
.reveal.active{opacity:1;transform:translateY(0)}
.delay-1{transition-delay:.1s}.delay-2{transition-delay:.2s}.delay-3{transition-delay:.3s}

/* ================= 1. 导航栏 (毛玻璃吸顶 + .rt 水平对齐) ================= */
header{position:fixed;top:0;left:0;right:0;z-index:99;background:rgba(247,244,236,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid rgba(221,213,196,0.5);transition:all 0.4s ease}
header.scrolled{box-shadow:0 4px 30px rgba(0,0,0,0.06);background:rgba(247,244,236,.96)}
.hd{display:flex;align-items:center;justify-content:space-between;height:76px}
.hd img{height:36px;width:auto}
.rt{display:flex;align-items:center;gap:36px}
nav{display:flex;gap:32px;font-size:13.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--g);font-weight:600}
nav a{position:relative;padding:5px 0}
nav a::after{content:'';position:absolute;bottom:0;left:0;width:0;height:2px;background:var(--au);transition:width 0.3s ease}
nav a:hover{color:var(--au)}
nav a:hover::after{width:100%}
.lang{display:flex;align-items:center;gap:14px;font-size:13px;letter-spacing:.1em;color:var(--mu);border-left:1px solid var(--ln);padding-left:28px}
.lang a{padding:2px 0}
.lang a:hover{color:var(--au)}
.lang a[aria-current]{color:var(--g);font-weight:bold;border-bottom:2px solid var(--au)}

/* ================= 2. 首屏英雄区 (左深右透渐变 + 20s Ken Burns 呼吸感) ================= */
.hero{position:relative;color:#F5F1E8;background:var(--g-dark);height:100vh;min-height:680px;display:flex;align-items:center;overflow:hidden}
.hero::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg, rgba(22,42,33,0.95) 0%, rgba(22,42,33,0.68) 52%, rgba(22,42,33,0.18) 100%);z-index:1}
.hero img.hero-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;animation:kenBurns 20s infinite alternate linear;will-change:transform}
@keyframes kenBurns{0%{transform:scale(1)}100%{transform:scale(1.1)}}
.hero .in{position:relative;z-index:2;width:100%}
.eyebrow{font-size:13px;letter-spacing:.3em;color:var(--au-light);text-transform:uppercase;font-weight:600;display:flex;align-items:center;gap:15px}
.eyebrow::before{content:'';display:block;width:30px;height:1px;background:var(--au-light)}
.hero h1{font-size:46px;line-height:1.22;margin:20px 0 24px;max-width:740px;text-shadow:0 4px 20px rgba(0,0,0,0.3)}
.hero p{max-width:620px;color:#E6E0D2;font-size:17px;line-height:1.8;opacity:0.92}
.rule{width:60px;height:3px;background:var(--au);margin:32px 0;border-radius:2px}

/* 科技感按钮流光特效 */
.cta{display:inline-flex;align-items:center;gap:10px;background:rgba(176,141,87,0.12);border:1px solid var(--au);color:var(--au-light);padding:14px 36px;font-size:14px;letter-spacing:.14em;text-transform:uppercase;position:relative;overflow:hidden;cursor:pointer;transition:all 0.4s ease;border-radius:2px}
.cta::after{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.22),transparent);transition:left 0.6s ease}
.cta:hover{background:var(--au);color:var(--g-dark);box-shadow:0 8px 24px rgba(176,141,87,0.3);transform:translateY(-2px);font-weight:600}
.cta:hover::after{left:100%}

/* ================= 3. 业务区块 (上浮 + 顶部金线 + 底部渐变遮罩) ================= */
section{padding:110px 0}
.sh{display:flex;align-items:baseline;gap:20px;margin-bottom:50px;border-bottom:1px solid var(--ln);padding-bottom:20px}
.sh h2{font-size:32px;color:var(--g)}
.sh span{font-size:12.5px;letter-spacing:.3em;color:var(--au);font-weight:600;font-family:var(--font-sans);text-transform:uppercase}

.biz{display:grid;grid-template-columns:repeat(6,1fr);gap:32px}
.biz article{grid-column:span 2;background:#fff;border-radius:4px;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,0.03);transition:all 0.4s ease;position:relative;border-top:3px solid transparent;display:flex;flex-direction:column}
.biz article:hover{transform:translateY(-8px);box-shadow:0 20px 40px rgba(31,58,46,0.08);border-top-color:var(--au)}
.biz article:nth-child(4),.biz article:nth-child(5){grid-column:span 3}

/* 图片遮罩与放大交互 */
.img-wrap{overflow:hidden;position:relative;aspect-ratio:4/3;background:var(--g2)}
.biz article:nth-child(4) .img-wrap,.biz article:nth-child(5) .img-wrap{aspect-ratio:16/9}
.img-wrap::after{content:'';position:absolute;inset:0;background:linear-gradient(to top, rgba(22,42,33,0.45) 0%, transparent 45%);opacity:0;transition:opacity 0.4s}
.biz article:hover .img-wrap::after{opacity:1}
.biz article:hover img{transform:scale(1.08)}
.biz img{width:100%;height:100%;object-fit:cover}

.biz .tx{padding:28px 26px;flex:1}
.no{font-family:var(--font-sans);color:var(--au);font-size:13px;letter-spacing:.2em;font-weight:700}
.biz h3{font-size:20px;color:var(--g);margin:8px 0 12px;line-height:1.4}
.biz p{color:var(--mu);font-size:14.5px;line-height:1.7}

/* ================= 4. 联系我们与科技感表单光晕 ================= */
.ct{background:linear-gradient(135deg, var(--g-dark) 0%, var(--g) 100%);color:#EDE7DA;position:relative;overflow:hidden}
.ct::before{content:'';position:absolute;width:600px;height:600px;border:1px solid rgba(217,194,154,0.1);border-radius:50%;top:-200px;right:-100px;pointer-events:none}
.ct::after{content:'';position:absolute;width:400px;height:400px;border:1px solid rgba(217,194,154,0.05);border-radius:50%;bottom:-100px;left:-100px;pointer-events:none}

.ct .sh{border-color:rgba(217,194,154,.2)}
.ct .sh h2{color:#F5F1E8}
.cg{display:grid;grid-template-columns:.9fr 1.1fr;gap:60px;position:relative;z-index:1}

.info dt{font-size:12.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--au-light);margin-top:28px;font-weight:600;display:flex;align-items:center;gap:8px}
.info dt:first-child{margin-top:0}
.info dt::before{content:'';display:inline-block;width:4px;height:4px;background:var(--au);border-radius:50%}
.info dd{font-size:15.5px;margin-top:6px;line-height:1.7;color:#E6E0D2}
.info a{border-bottom:1px solid rgba(217,194,154,.4);padding-bottom:2px}
.info a:hover{color:var(--au-light);border-color:var(--au-light)}

/* 表单输入框香槟金光晕交互 */
form{display:grid;grid-template-columns:1fr 1fr;gap:24px}
label{font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--au-light);display:flex;flex-direction:column;gap:8px;min-width:0}
.full{grid-column:1/-1}
input,select,textarea{font-family:var(--font-sans);font-size:15px;background:rgba(255,255,255,0.03);border:1px solid rgba(217,194,154,0.2);color:#F5F1E8;padding:14px 16px;outline:none;border-radius:4px;width:100%;transition:all 0.3s ease}
input::placeholder,textarea::placeholder{color:rgba(230,224,210,0.4)}
input:focus,select:focus,textarea:focus{border-color:var(--au);background:rgba(255,255,255,0.06);box-shadow:0 0 15px rgba(176,141,87,0.18)}
select option{color:var(--ink);background:#fff}
textarea{min-height:120px;resize:vertical}
